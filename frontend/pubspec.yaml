name: my_first_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.1
  google_fonts: ^8.2.1
  supabase_flutter: ^2.17.2

  # Added for the journal module:
  provider: ^6.1.2       # shares JournalRepository's state across screens
  image_picker: ^1.1.2   # photo slot camera/gallery picking

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Uncomment and adjust once your journal image/sound assets are ready:
  # assets:
  #   - assets/images/
  #   - assets/sounds/
